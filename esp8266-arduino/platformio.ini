; PlatformIO Project Configuration File
; OneTapGo ESP8266 NFC Writer with MQTT
; Hardware: NodeMCU LoLin V3 (HW 364-A) with RC522 and SSD1306 LCD
;
; Build: pio run -e nodemcuv2
; Upload: pio run -e nodemcuv2 -t upload
; Monitor: pio device monitor
; Full: pio run -e nodemcuv2 -t upload && pio device monitor

[platformio]
default_envs = nodemcuv2
description = OneTapGo ESP8266 NFC Writer with MQTT Integration
name = onetapgo-esp8266

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino


; Serial Monitor
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; Build Configuration
build_type = release
build_flags = 
    -D DEBUG_ESP_PORT=Serial
    -D DEBUG_LEVEL=DEBUG_LEVEL_NONE
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D BOARD_HAS_PULLUPS
    ; Optimize for size
    -Os
    ; Disable LTO
    -fno-lto
    ; Stack protection
    -fstack-protector
    ; Enable soft SPI for MFRC522
    ;-DUSE_SOFT_SPI 
    ; Warnings
    -Wall
    -Wextra
    -Wno-unused-parameter

; Board Configuration
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m2m.ld

; Flash Configuration (4MB with 2MB OTA)
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
upload_speed = 115200  ; Ou 57600/460800
upload_resetmethod = nodemcu

; Libraries - Production versions
; IMPORTANT: NDEF_MFRC522 provides NdefMessage.h and NfcAdapter.h
lib_deps =
    ; WiFi Manager - Configuration portal
    tzapu/WiFiManager@^0.16.0
    
    ; MQTT Client with SSL support
    knolleary/PubSubClient@^2.8
    
    ; JSON Processing
    bblanchon/ArduinoJson@^6.21.5
    
    ; NFC/RFID Reader - MFRC522 hardware library
    miguelbalboa/MFRC522@^1.4.12
    
    ; NDEF Library for ESP8266 + MFRC522
    ; This provides NdefMessage.h and NfcAdapter.h
    nitek/NDEF_MFRC522@^2.0.0
    
    ; OLED Display
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5

[env:nodemcuv2-debug]
extends = env:nodemcuv2
build_type = debug
build_flags = 
    ${env:nodemcuv2.build_flags}
    -D DEBUG_LEVEL=DEBUG_LEVEL_DEBUG
monitor_filters = 
    ${env:nodemcuv2.monitor_filters}
    log2file

[env:nodemcuv2-minimal]
extends = env:nodemcuv2
; Minimal build for smaller binary
build_flags = 
    ${env:nodemcuv2.build_flags}
    -D DISABLE_ALL_SERIAL
    -D NDEBUG
lib_deps =
    tzapu/WiFiManager@^0.16.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    miguelbalboa/MFRC522@^1.4.12
    nitek/NDEF_MFRC522@^2.0.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
