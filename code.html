</head>
<body class="min-h-screen flex flex-col text-gray-900 selection:bg-blue-100">
<header class="px-4 sm:px-6 pt-4 sm:pt-6 pb-2 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-8 h-8 flex items-center justify-center bg-black/[0.04] rounded-lg border border-white/40 overflow-hidden">
<img alt="Logo da igreja" class="w-full h-full object-contain hidden" id="tenant-logo" src=""/>
<span class="material-symbols-outlined text-black/60 text-lg" id="tenant-logo-fallback">church</span>
</div>
<div class="flex flex-col -space-y-0.5">
<span class="font-bold text-[16px] tracking-tight truncate max-w-[180px]" id="tenant-name">Igreja</span>
<span class="text-gray-400 font-medium text-[9px] uppercase tracking-widest" id="tenant-subtitle">Church</span>
</div>
</div>
<div class="flex items-center">
<button class="w-2 h-2 rounded-full flex items-center justify-end active:bg-black/5 transition-colors" type="button">
<span class="material-symbols-outlined text-[24px] text-gray-400">more_vert</span>
</button>
</div>
</header>

<main class="checkout-main flex-grow flex flex-col items-center justify-start pt-5 sm:pt-8 px-4 sm:px-6 max-w-md mx-auto w-full">
<div class="w-full max-w-[400px] mb-2">
<button aria-expanded="false" class="giving-trigger-btn is-hint w-full h-[46px] rounded-full segmented-control-bg border border-white/30 px-4 flex items-center justify-between active:scale-[0.99] transition-transform" id="open-giving-modal-btn" type="button">
<span class="giving-trigger-left">
<span class="material-symbols-outlined">volunteer_activism</span>
<span>Motivo do pagamento</span>
</span>
<span class="giving-trigger-right">
<span class="truncate max-w-[150px]" id="selected-giving-chip">Ver opções</span>
<span aria-hidden="true" class="material-symbols-outlined giving-trigger-chevron">expand_more</span>
</span>
</button>
<p class="text-center text-[11px] text-gray-500 font-medium mt-2 min-h-[16px]" id="selected-giving-label">Toque para ver as opções</p>
</div>
<div class="amount-section w-full text-center mb-4" id="amount-section">
<button aria-label="Valor a pagar" class="amount-tap-target" id="amount-tap-target" type="button">
<span class="currency-symbol text-[24px] font-semibold text-gray-300 mr-2 self-center translate-y-1">R$</span>
<span class="amount-text font-bold tracking-tight text-black leading-tight" id="amount-display">0,00</span>
</button>
<input autocomplete="off" class="native-amount-input" id="native-amount-input" inputmode="decimal" type="text"/>
<p class="text-center text-[12px] text-gray-500 font-medium min-h-[18px] mt-2" id="amount-constraint-message"></p>
<p class="native-keyboard-hint hidden" id="native-keyboard-hint">Toque no valor para abrir o teclado numérico</p>
</div>
<div class="keypad-grid w-full grid grid-cols-3 gap-y-2 gap-x-3 max-w-[300px]" id="amount-keypad">
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="1" type="button">1</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="2" type="button">2</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="3" type="button">3</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="4" type="button">4</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="5" type="button">5</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="6" type="button">6</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="7" type="button">7</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="8" type="button">8</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="9" type="button">9</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-gray-400 flex items-center justify-center" data-key="," type="button">
<span class="text-2xl mt-[-8px]">,</span>
</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-black flex items-center justify-center" data-key="0" type="button">0</button>
<button class="keypad-btn h-14 text-[24px] font-normal rounded-full text-gray-400 flex items-center justify-center" data-key="backspace" type="button">
<span class="material-symbols-outlined text-[26px]">backspace</span>
</button>
</div>
</main>

<div class="fixed bottom-0 left-0 right-0 glass-panel rounded-t-[36px] px-4 sm:px-6 pt-3 sm:pt-5 pb-3 z-40 max-w-md mx-auto border-t border-white/60 shadow-[0_-8px_40px_rgba(0,0,0,0.03)]" id="checkout-footer">
<button class="apple-pay-btn w-full h-[52px] rounded-[14px] font-medium text-[17px] flex items-center justify-center gap-1.5 active:opacity-80 transition-opacity mb-2" type="button">
<span>Pay</span>
<span class="font-bold text-[22px] leading-none mb-0.5"></span>
</button>
<button class="w-full bg-white border border-black/[0.03] shadow-sm text-black h-[52px] rounded-[14px] font-semibold text-[15px] flex items-center justify-center gap-2 active:bg-gray-50 transition-colors mb-4" id="pay-pix-btn" type="button">
<span class="material-symbols-outlined text-[#00BDF2] text-[22px] font-bold">qr_code_scanner</span>
            Pagar com Pix
        </button>
<div class="relative w-full mb-2 overflow-hidden">
<div class="flex overflow-x-auto hide-scrollbar gap-3 px-1 pb-1" id="bank-shortcuts"></div>
</div>
<button aria-expanded="false" class="other-methods-btn rounded-full active:opacity-70 transition-opacity" id="other-methods-btn" type="button">
<span>Outros Métodos</span>
<span aria-hidden="true" class="material-symbols-outlined">expand_more</span>
</button>
</div>

<div aria-hidden="true" class="bank-modal hidden" id="bank-modal">
<button aria-label="Fechar seleção de banco" class="bank-modal-backdrop" data-close-bank-modal="" type="button"></button>
<section aria-labelledby="bank-modal-title" class="bank-modal-panel glass-panel max-w-md mx-auto w-full rounded-t-[32px] border border-white/70 shadow-[0_-10px_40px_rgba(0,0,0,0.08)]">
<div class="px-6 pt-5 pb-4 flex items-center justify-between">
<button class="w-9 h-9 rounded-full flex items-center justify-center active:bg-black/5 transition-colors" data-close-bank-modal="" type="button">
<span class="material-symbols-outlined text-[22px] text-black/70">arrow_back</span>
</button>
<h2 class="text-[18px] font-semibold tracking-tight" id="bank-modal-title">Selecionar banco</h2>
<span class="w-9"></span>
</div>
<div class="px-6 pb-4">
<label class="relative block" for="bank-search-input">
<span class="material-symbols-outlined text-gray-400 text-[20px] absolute left-3 top-1/2 -translate-y-1/2">search</span>
<input autocomplete="off" class="w-full h-12 rounded-[14px] bg-black/[0.04] border border-black/[0.03] pl-10 pr-4 text-[15px] text-black placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-black/10" id="bank-search-input" placeholder="Buscar banco" type="text"/>
</label>
</div>
<p class="px-6 text-[12px] uppercase tracking-widest font-semibold text-gray-400 mb-2" id="bank-modal-status">Carregando bancos...</p>
<div class="px-4 pb-4">
<div class="max-h-[52dvh] overflow-y-auto hide-scrollbar" id="bank-modal-list"></div>
</div>
<div class="px-6 pb-6 pt-1">
<button class="hidden" disabled="" id="confirm-bank-btn" type="button">
        </button>
</div>
</section>
</div>

<div aria-hidden="true" class="giving-modal hidden" id="giving-modal">
<button aria-label="Fechar seleção de motivo" class="giving-modal-backdrop" data-close-giving-modal="" type="button"></button>
<section aria-labelledby="giving-modal-title" class="giving-modal-panel glass-panel max-w-md mx-auto w-full rounded-t-[32px] border border-white/70 shadow-[0_-10px_40px_rgba(0,0,0,0.08)]">
<div class="px-6 pt-5 pb-2 flex items-center justify-between">
<button class="w-9 h-9 rounded-full flex items-center justify-center active:bg-black/5 transition-colors" data-close-giving-modal="" type="button">
<span class="material-symbols-outlined text-[22px] text-black/70">arrow_back</span>
</button>
<h2 class="text-[18px] font-semibold tracking-tight" id="giving-modal-title">Selecionar motivo</h2>
<span class="w-9"></span>
</div>
<p class="px-6 text-[12px] uppercase tracking-widest font-semibold text-gray-400 mb-2">Escolha 1 opção</p>
<div class="px-4 pb-6">
<div class="max-h-[54dvh] overflow-y-auto hide-scrollbar" id="giving-modal-list"></div>
</div>
</section>
</div>

</body>
